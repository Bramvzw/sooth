[package]
name = "sooth"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
description = "The truth about your tests — a local, single-binary observer that runs your test command and proves which tests are flaky. No server, no telemetry."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bramvzw/sooth"
homepage = "https://bramvzw.nl"
keywords = ["testing", "flaky", "cli", "test", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.41.0"
# Signals cannot be handled from std without `unsafe`, which this crate
# forbids. Only the flag API is used, so the iterator and channel features
# stay off (see DECISIONS.md, "A signal is a request to stop").
signal-hook = { version = "0.4", default-features = false }
# Reads a project's `composer.json`: someone else's free-form JSON, unlike the
# fixed shapes sooth writes and reads by hand (see DECISIONS.md, "A Composer
# script that hands the report flag to more than one command").
serde_json = "1"

[[bin]]
name = "sooth"
path = "src/main.rs"

# A third smaller for the same runtime, at a build that takes twice as long
# and happens once per release. `panic` stays at unwind on purpose: the
# guards that remove sooth's temp files run while a panic unwinds, and
# `abort` would save another 150 kB by bringing that leak back.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[lints.rust]
# forbid, not deny: cannot be overridden with an #[allow] anywhere,
# so "this binary contains no unsafe" is a guarantee, not a default.
unsafe_code = "forbid"
# A lint exception that no longer fires fails the build, locally as in CI.
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
# deny, not warn: CI runs `-D warnings`, so pedantic already fails the build
# there — a plain local `cargo clippy` should agree with CI.
pedantic = { level = "deny", priority = -1 }
# The layering invariants in AGENTS.md: only report.rs prints, only the
# modules clippy.toml names spawn processes. Each exception is an #[expect].
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
# The code rules in CONTRIBUTING.md: a bug panics with a message (`expect`),
# input never reaches a bare `unwrap`.
unwrap_used = "deny"
# Slicing a &str by byte offset panics inside a multi-byte character.
string_slice = "deny"
# Exceptions are #[expect], which fails once it is no longer needed.
allow_attributes = "deny"
